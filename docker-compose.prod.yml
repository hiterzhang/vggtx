services:
  vggt:
    image: ${VGGT_IMAGE:-vggt:local}
    container_name: vggt
    restart: unless-stopped
    working_dir: /app/vggt
    stdin_open: true
    tty: true
    gpus: all
    ports:
      - "8080:8080"
    environment:
      TORCH_HOME: /opt/vggt-cache/torch
      VGGT_PYTHON: /opt/vggt-env/bin/python
      VGGT_MODEL_PATH: /weights/model.pt
      VGGT_REQUIRE_LOCAL_WEIGHTS: "1"
      VGGT_EXAMPLES_ROOT: /data/vggt/examples
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - type: bind
        source: /home/zzh/vggt_docker_test/vggt_src
        target: /app/vggt
      - type: bind
        source: /home/zzh/vggt_attach/weights/model.pt
        target: /weights/model.pt
        read_only: true
      - type: bind
        source: /home/zzh/vggt_attach/examples
        target: /data/vggt/examples
        read_only: true
      - type: bind
        source: /home/zzh/vggt_attach/output
        target: /app/vggt/outputs
    command: ["sleep", "infinity"]
